name: Ticket Manager CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'audit/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript and Vite production build
        run: npm run build
